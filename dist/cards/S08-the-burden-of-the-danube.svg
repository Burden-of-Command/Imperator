<svg xmlns="http://www.w3.org/2000/svg" width="2.5in" height="3.5in" viewBox="0 0 750 1050">
<rect width="750" height="1050" rx="34" fill="#e8e3d8"/>
<rect x="20" y="20" width="710" height="1010" rx="28" fill="none" stroke="#8b2f2b" stroke-width="4"/>
<path d="M55 165H695M55 550H695M55 914H695" stroke="#8b2f2b" stroke-width="2"/>
<text x="55" y="78" fill="#8b2f2b" font-family="Arial,sans-serif" font-size="18" font-weight="bold" letter-spacing="2">S08  SCENARIO / DIFFICULTY 4</text>
<text x="55" y="137" fill="#272722" font-family="Georgia,serif" font-size="34" font-weight="bold">The Burden of the Danube</text>
<text x="55" y="215" fill="#8b2f2b" font-family="Arial,sans-serif" font-size="20" font-weight="bold" letter-spacing="3">166-180 CE</text>
<text x="55" y="270" fill="#272722" font-family="Georgia,serif" font-size="27"><tspan x="55" dy="0">A compressed full reign: epidemic,</tspan><tspan x="55" dy="34">invasion, counteroffensive, revolt,</tspan><tspan x="55" dy="34">renewed war, and the question of what</tspan><tspan x="55" dy="34">peace will survive.</tspan></text>
<text x="55" y="602" fill="#8b2f2b" font-family="Arial,sans-serif" font-size="20" font-weight="bold" letter-spacing="3">10 ROUNDS</text>
<text x="55" y="657" fill="#272722" font-family="Georgia,serif" font-size="20"><tspan x="55" dy="0">Start tracks: R6 Se5 Re6 Tr6 Su6 F1 Me1. Legions: Aq1</tspan><tspan x="55" dy="25">La2 Ca2 Si1. Armies: all home. Strength: Ra2 Ma2 Qu3</tspan><tspan x="55" dy="25">Ia2. Objective: 4 Momentum; Strength total &lt;= 15;</tspan><tspan x="55" dy="25">Mercy 2+; Senate 3+. After rounds 3 and 6, reduce</tspan><tspan x="55" dy="25">Fatigue and Coalition by 2, gain 1 Supply, and</tspan><tspan x="55" dy="25">restore 1 to your lowest state track; then increase</tspan><tspan x="55" dy="25">the highest Strength by 1. At round 8, lose 1</tspan><tspan x="55" dy="25">Resolve.</tspan></text>
<text x="375" y="965" text-anchor="middle" fill="#8b2f2b" font-family="Arial,sans-serif" font-size="14" font-weight="bold" letter-spacing="2">HISTORY SETS THE BURDEN. YOUR JUDGMENT SETS THE END.</text>
<circle cx="375" cy="995" r="7" fill="#8b2f2b"/>
</svg>