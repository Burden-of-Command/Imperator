<svg xmlns="http://www.w3.org/2000/svg" width="2.5in" height="3.5in" viewBox="0 0 750 1050">
<rect width="750" height="1050" rx="34" fill="#e8e3d8"/>
<rect x="20" y="20" width="710" height="1010" rx="28" fill="none" stroke="#8b2f2b" stroke-width="4"/>
<path d="M55 165H695M55 550H695M55 914H695" stroke="#8b2f2b" stroke-width="2"/>
<text x="55" y="78" fill="#8b2f2b" font-family="Arial,sans-serif" font-size="18" font-weight="bold" letter-spacing="2">S07  SCENARIO / DIFFICULTY 4</text>
<text x="55" y="137" fill="#272722" font-family="Georgia,serif" font-size="42" font-weight="bold">The Second Expedition</text>
<text x="55" y="215" fill="#8b2f2b" font-family="Arial,sans-serif" font-size="20" font-weight="bold" letter-spacing="3">178-180 CE</text>
<text x="55" y="270" fill="#272722" font-family="Georgia,serif" font-size="27"><tspan x="55" dy="0">War resumes. Marcus pursues an unfinished</tspan><tspan x="55" dy="34">northern settlement while age, fatigue,</tspan><tspan x="55" dy="34">and succession narrow his time.</tspan></text>
<text x="55" y="602" fill="#8b2f2b" font-family="Arial,sans-serif" font-size="20" font-weight="bold" letter-spacing="3">8 ROUNDS</text>
<text x="55" y="657" fill="#272722" font-family="Georgia,serif" font-size="20"><tspan x="55" dy="0">Start tracks: R5 Se4 Re5 Tr4 Su5 F2 Me2. Legions: Aq1</tspan><tspan x="55" dy="25">La1 Ca2 Si2. Hosts: Qu@Ca. Strength: Ra1 Ma2 Qu3 Ia3.</tspan><tspan x="55" dy="25">Objective: 5 Momentum; Strength total &lt;= 10. At the</tspan><tspan x="55" dy="25">end of rounds 4 and 7, lose 1 Resolve unless you</tspan><tspan x="55" dy="25">Meditated that round.</tspan></text>
<text x="375" y="965" text-anchor="middle" fill="#8b2f2b" font-family="Arial,sans-serif" font-size="14" font-weight="bold" letter-spacing="2">HISTORY SETS THE BURDEN. YOUR JUDGMENT SETS THE END.</text>
<circle cx="375" cy="995" r="7" fill="#8b2f2b"/>
</svg>