<svg xmlns="http://www.w3.org/2000/svg" width="2.5in" height="3.5in" viewBox="0 0 750 1050">
<rect width="750" height="1050" rx="34" fill="#e8e3d8"/>
<rect x="20" y="20" width="710" height="1010" rx="28" fill="none" stroke="#8b2f2b" stroke-width="4"/>
<path d="M55 165H695M55 550H695M55 914H695" stroke="#8b2f2b" stroke-width="2"/>
<text x="55" y="78" fill="#8b2f2b" font-family="Arial,sans-serif" font-size="18" font-weight="bold" letter-spacing="2">S04  SCENARIO / DIFFICULTY 3</text>
<text x="55" y="137" fill="#272722" font-family="Georgia,serif" font-size="42" font-weight="bold">Among the Quadi</text>
<text x="55" y="215" fill="#8b2f2b" font-family="Arial,sans-serif" font-size="20" font-weight="bold" letter-spacing="3">173-174 CE</text>
<text x="55" y="270" fill="#272722" font-family="Georgia,serif" font-size="27"><tspan x="55" dy="0">The Quadi campaign combines hard</tspan><tspan x="55" dy="34">fighting, disputed kingship, thirst,</tspan><tspan x="55" dy="34">weather, and propaganda.</tspan></text>
<text x="55" y="602" fill="#8b2f2b" font-family="Arial,sans-serif" font-size="20" font-weight="bold" letter-spacing="3">7 ROUNDS</text>
<text x="55" y="657" fill="#272722" font-family="Georgia,serif" font-size="22"><tspan x="55" dy="0">Start tracks: R6 Se4 Re5 Tr3 Su4 F3 Me1. Legions:</tspan><tspan x="55" dy="28">Aq1 La2 Ca2 Si1. Threat: Ra1 Ma3 Qu3 Ia2.</tspan><tspan x="55" dy="28">Objective: 5 Momentum; Mercy 2+. Once per game</tspan><tspan x="55" dy="28">after losing a battle, set both dice to 4; then</tspan><tspan x="55" dy="28">lose 1 Treasury. This represents the contested</tspan><tspan x="55" dy="28">rain-miracle tradition without choosing an</tspan><tspan x="55" dy="28">explanation.</tspan></text>
<text x="375" y="965" text-anchor="middle" fill="#8b2f2b" font-family="Arial,sans-serif" font-size="14" font-weight="bold" letter-spacing="2">HISTORY SETS THE BURDEN. YOUR JUDGMENT SETS THE END.</text>
<circle cx="375" cy="995" r="7" fill="#8b2f2b"/>
</svg>