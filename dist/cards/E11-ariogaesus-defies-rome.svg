<rect x="20" y="20" width="710" height="1010" rx="28" fill="none" stroke="#9f493d" stroke-width="4"/>
<path d="M55 165H695M55 550H695M55 914H695" stroke="#9f493d" stroke-width="2"/>
<text x="55" y="78" fill="#9f493d" font-family="Arial,sans-serif" font-size="18" font-weight="bold" letter-spacing="2">E11  CRISIS / GROUP F</text>
<text x="55" y="137" fill="#eee8d8" font-family="Georgia,serif" font-size="42" font-weight="bold">Ariogaesus Defies Rome</text>
<text x="55" y="215" fill="#9f493d" font-family="Arial,sans-serif" font-size="20" font-weight="bold" letter-spacing="3">ARRIVAL</text>
<text x="55" y="270" fill="#eee8d8" font-family="Georgia,serif" font-size="27"><tspan x="55" dy="0">Increase Quadi Strength by 2 unless you</tspan><tspan x="55" dy="34">spend 1 Senate.</tspan></text>
<text x="55" y="602" fill="#9f493d" font-family="Arial,sans-serif" font-size="20" font-weight="bold" letter-spacing="3">QUADI ARMY: RAID</text>
<text x="55" y="657" fill="#eee8d8" font-family="Georgia,serif" font-size="27"><tspan x="55" dy="0">If Quadi Strength is 1 or less, gain 1</tspan><tspan x="55" dy="34">Momentum.</tspan></text>
<text x="375" y="965" text-anchor="middle" fill="#9f493d" font-family="Arial,sans-serif" font-size="14" font-weight="bold" letter-spacing="2">WHAT ARRIVES IS NOT YOURS. WHAT YOU DO IS.</text>
<circle cx="375" cy="995" r="7" fill="#9f493d"/>
